name: Refresh hero data

on:
  # Four runs a day, off the hour (GitHub delays jobs queued on the hour).
  # 4 x 250 pages plus 4 x about 105 requests for backtest games stays well
  # inside OpenDota's free daily allowance.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and build the data, but don't upload it or open issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://odigcdwsvajkbvcxeskj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build on the last published data. The very first run starts from the
      # copy in the repo instead.
      - name: Download the latest data
        working-directory: services/engine
        run: npm run pull-data || echo "::warning::No published data yet, starting from the repo copy"
      - id: fetch
        run: npm run fetch-data -w services/engine -- --pages 250
      - if: ${{ !inputs.dry_run }}
        run: npm run upload-data -w services/engine
      # Recent ranked games for the engine backtest, saved to eval/ in the same
      # bucket. A failure here must not hold back the hero data uploaded above.
      - name: Save ranked games for the backtest
        continue-on-error: true
        run: npm run collect-matches -w services/engine -- --max 100 ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Open a review issue for the new patch
        if: ${{ steps.fetch.outputs.new_patch && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH: ${{ steps.fetch.outputs.new_patch }}
        run: |
          gh issue create --title "Review the hand-kept hero lists for patch $PATCH" --body "Patch $PATCH is out. Old matchup and synergy counts now count 25%, and only $PATCH games are added from now on.

          The hand-kept lists don't update themselves. Check them against the patch notes:

          - [ ] Hard counters (dota2-team-picker-web \`src/lib/hard-counters.ts\`): re-check each pair once about a week of $PATCH games is in.
          - [ ] Spell combos and team styles (\`services/engine/src/engine/gameplan.ts\`).
          - [ ] Traits for new or reworked heroes (\`services/engine/src/engine/traits.ts\`)."
