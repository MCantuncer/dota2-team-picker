name: Refresh hero data

on:
  # Four runs a day, off the hour (GitHub delays jobs queued on the hour).
  # 4 x 250 pages plus 4 x up to 140 requests for backtest games stays
  # inside OpenDota's free daily allowance (the collector stops early when it runs low).
  # The last run starts 14:17 UTC and the lookups are free again by about
  # 15:45 UTC (later when GitHub delays the run), before the evening games in
  # Europe: while a run uses the STRATZ token, the site's matchup lookups
  # wait (see the mark-refresh steps).
  schedule:
    - cron: "17 2,6,10,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and build the data, but don't upload it or open issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://odigcdwsvajkbvcxeskj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # STRATZ lets a token be used from 2 addresses per 15 minutes, and the
      # site's matchup lookups share this token: they wait while this is marked,
      # and this step waits until 15 minutes after their last call. A failed
      # mark must not stop the refresh, but it shows as a warning.
      - name: Tell the matchup lookups the refresh is using STRATZ
        run: npm run mark-refresh -w services/engine -- start || echo "::warning::Could not mark the STRATZ refresh as started"
      # Build on the last published data. The very first run starts from the
      # copy in the repo instead.
      - name: Download the latest data
        working-directory: services/engine
        run: npm run pull-data || echo "::warning::No published data yet, starting from the repo copy"
      - id: fetch
        run: npm run fetch-data -w services/engine -- --pages 250
      # Learn how much each score part counts from the saved games, and keep the
      # weights only if they beat the hand-set ones on newer games. Runs before
      # the win chance so that is fitted on the engine as it will run. If this
      # step fails, the data keeps the last checked weights.
      - name: Fit the score weights
        continue-on-error: true
        working-directory: services/engine
        run: npm run fit-score-weights -- --out "$RUNNER_TEMP/score-weights.md" && cat "$RUNNER_TEMP/score-weights.md" >> "$GITHUB_STEP_SUMMARY"
      # Refit the draft win chance on the saved games and check it on the newest
      # ones. Only a model that passes goes into the data. If this step fails,
      # the data keeps the last checked model.
      - name: Fit the draft win chance
        continue-on-error: true
        working-directory: services/engine
        run: npm run fit-win-chance -- --out "$RUNNER_TEMP/win-chance.md" && cat "$RUNNER_TEMP/win-chance.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !inputs.dry_run }}
        run: npm run upload-data -w services/engine
      # Recent ranked games for the engine backtest, saved to eval/ in the same
      # bucket. A failure here must not hold back the hero data uploaded above.
      - name: Save ranked games for the backtest
        continue-on-error: true
        run: npm run collect-matches -w services/engine -- --max 100 ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Open a review issue for the new patch
        if: ${{ steps.fetch.outputs.new_patch && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH: ${{ steps.fetch.outputs.new_patch }}
        run: |
          gh issue create --title "Review the hand-kept hero lists for patch $PATCH" --body "Patch $PATCH is out. Old matchup and synergy counts now count 25%, and only $PATCH games are added from now on.

          The hand-kept lists don't update themselves. Check them against the patch notes:

          - [ ] Hard counters (\`services/engine/src/engine/hard-counters.ts\`): re-check each pair once about a week of $PATCH games is in.
          - [ ] Spell combos and team styles (\`services/engine/src/engine/gameplan.ts\`).
          - [ ] Traits for new or reworked heroes (\`services/engine/src/engine/traits.ts\`)."
      # Runs even when a step above failed, so the lookups don't wait for the
      # mark to run out (90 minutes).
      - name: Tell the matchup lookups the refresh is done
        if: ${{ always() }}
        run: npm run mark-refresh -w services/engine -- end || echo "::warning::Could not mark the STRATZ refresh as done"
