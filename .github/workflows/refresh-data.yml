name: Refresh hero data

on:
  # Four runs a day, off the hour (GitHub delays jobs queued on the hour).
  # 4 x 250 pages plus 4 x up to 300 requests for backtest games stays
  # inside OpenDota's free daily allowance (the collector stops early when it runs low).
  # The last run starts 14:17 UTC and the lookups are free again by about
  # 15:45 UTC (later when GitHub delays the run), before the evening games in
  # Europe: while a run uses the STRATZ token, the site's matchup lookups
  # wait (see the mark-refresh steps).
  schedule:
    - cron: "17 2,6,10,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and build the data, but don't upload it or open issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://odigcdwsvajkbvcxeskj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # STRATZ lets a token be used from 2 addresses per 15 minutes, and the
      # site's matchup lookups share this token: they wait while this is marked,
      # and this step waits until 15 minutes after their last call. A failed
      # mark must not stop the refresh, but it shows as a warning.
      - name: Tell the matchup lookups the refresh is using STRATZ
        run: npm run mark-refresh -w services/engine -- start || echo "::warning::Could not mark the STRATZ refresh as started"
      # Build on the last published data. The very first run starts from the
      # copy in the repo instead.
      - name: Download the latest data
        working-directory: services/engine
        run: npm run pull-data || echo "::warning::No published data yet, starting from the repo copy"
      - id: fetch
        run: npm run fetch-data -w services/engine -- --pages 250
      # One issue for data sources that have kept failing for 2 days (each run keeps
      # the last good data, so the site still works), or when the published data is
      # over 24 hours old because runs keep failing before they upload. It runs even
      # when the step above failed, updates itself and closes when every source works
      # again; a source that fails once never shows up. Sources still catching up with
      # a patch go in the log and on Data Status only.
      - name: Open or close the data source issue
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: services/engine
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Hero data sources keep failing
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm run source-health -- --body "$RUNNER_TEMP/source-health.md"
          if [ "$DRY_RUN" = "true" ]; then exit 0; fi
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -s "$RUNNER_TEMP/source-health.md" ]; then
            if [ -n "$number" ]; then gh issue edit "$number" --body-file "$RUNNER_TEMP/source-health.md"
            else gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/source-health.md"; fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --reason completed
          fi
      # Learn how much each score part counts from the saved games, and keep the
      # weights only if they beat the hand-set ones on newer games. Runs before
      # the win chance so that is fitted on the engine as it will run. If this
      # step fails, the data keeps the last checked weights.
      - name: Fit the score weights
        continue-on-error: true
        working-directory: services/engine
        run: npm run fit-score-weights -- --out "$RUNNER_TEMP/score-weights.md" && cat "$RUNNER_TEMP/score-weights.md" >> "$GITHUB_STEP_SUMMARY"
      # Refit the draft win chance on the saved games and check it on the newest
      # ones. Only a model that passes goes into the data. If this step fails,
      # the data keeps the last checked model.
      - name: Fit the draft win chance
        continue-on-error: true
        working-directory: services/engine
        run: npm run fit-win-chance -- --out "$RUNNER_TEMP/win-chance.md" && cat "$RUNNER_TEMP/win-chance.md" >> "$GITHUB_STEP_SUMMARY"
      # Score yesterday's fair public ranked games (about 4,000, from the OpenDota
      # explorer) into eval/public-edges.json, refit the win range bands on the last
      # 21 days and check them on the newest quarter. Only bands that pass go into
      # the data. If this step fails, the data keeps the last checked bands.
      - name: Fit the draft win range
        continue-on-error: true
        working-directory: services/engine
        run: npm run fit-win-range -- --out "$RUNNER_TEMP/win-range.md" ${{ inputs.dry_run && '--dry-run' || '' }} && cat "$RUNNER_TEMP/win-range.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !inputs.dry_run }}
        run: npm run upload-data -w services/engine
      # Recent ranked games for the engine backtest, saved to eval/ in the same
      # bucket. A failure here must not hold back the hero data uploaded above.
      # 300 a run gives about 420 complete games a day (about a third have more than
      # 10 pick rows and are skipped), so the Proof Page reaches 15,000 games in
      # about five weeks instead of fifteen.
      - name: Save ranked games for the backtest
        continue-on-error: true
        run: npm run collect-matches -w services/engine -- --max 300 ${{ inputs.dry_run && '--dry-run' || '' }}
      # The Proof Page numbers (proof.json in the bucket): the engine and two rivals
      # on the newest 4,000 saved games of the last 28 days, each scored with the
      # hero data copy built before it. Once a day: a newer proof.json is kept.
      - name: Build the Proof Page numbers
        continue-on-error: true
        timeout-minutes: 15
        working-directory: services/engine
        run: npm run proof -- --out "$RUNNER_TEMP/proof.md" ${{ inputs.dry_run && '--dry-run' || '' }} && cat "$RUNNER_TEMP/proof.md" >> "$GITHUB_STEP_SUMMARY"
      # The Meta page numbers (meta.json in the bucket): each hero's games and wins per
      # day of this patch and the last 7 days of the patch before, per rank group, from
      # the OpenDota explorer. Days already complete in meta.json are kept, so most runs
      # read only the newest day. A failure keeps the last meta.json.
      - name: Build the Meta page numbers
        continue-on-error: true
        timeout-minutes: 15
        working-directory: services/engine
        run: npm run meta -- --out "$RUNNER_TEMP/meta.md" ${{ inputs.dry_run && '--dry-run' || '' }} && cat "$RUNNER_TEMP/meta.md" >> "$GITHUB_STEP_SUMMARY"
      # Runs even when a step above failed, so the lookups don't wait for the
      # mark to run out (90 minutes).
      - name: Tell the matchup lookups the refresh is done
        if: ${{ always() }}
        run: npm run mark-refresh -w services/engine -- end || echo "::warning::Could not mark the STRATZ refresh as done"
