name: Item reports

# Runs the offline item reports against the matchup cache on demand, so they
# don't need a local copy of the secret key. The reports read the cache and the
# published data only: no STRATZ calls, nothing uploaded. matchup-probe asks
# STRATZ a few lookup queries and prints counts only (run it outside the
# refresh runs at 02, 06, 10 and 14:17 UTC). Results are in the job log and
# summary.
on:
  workflow_dispatch:
    inputs:
      report:
        description: "Which report to run"
        type: choice
        options:
          - item-problem-report
          - item-patterns-report
          - item-odds-report
          - matchup-probe
        default: item-problem-report
      focus:
        description: "Hero id that item-problem-report and item-patterns-report print in full (optional)"
        default: ""

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the latest data
        working-directory: services/engine
        run: npm run pull-data
      - name: Run the report
        working-directory: services/engine
        shell: bash
        # Only this step gets the keys: install scripts and the download don't need them.
        # Each run gets only the key it uses.
        env:
          REPORT: ${{ inputs.report }}
          FOCUS: ${{ inputs.focus }}
          SUPABASE_URL: https://odigcdwsvajkbvcxeskj.supabase.co
          SUPABASE_SECRET_KEY: ${{ inputs.report != 'matchup-probe' && secrets.SUPABASE_SECRET_KEY || '' }}
          STRATZ_TOKEN: ${{ inputs.report == 'matchup-probe' && secrets.STRATZ_TOKEN || '' }}
        run: |
          npm run "$REPORT" | tee "$RUNNER_TEMP/report.txt"
          { echo '```'; cat "$RUNNER_TEMP/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
