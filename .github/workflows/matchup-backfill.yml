name: Matchup backfill

# Fills the matchup cache ahead of drafts (services/accounts/supabase/functions/
# _shared/matchup/backfill.ts): the most played heroes of each position against
# every enemy, through the live lookup, so it waits for the hero data refresh
# and stops on a 429. Each run takes at most 400 of the 600 STRATZ calls an hour
# and carries on where the last stopped.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      heroes_per_position:
        description: "Most played heroes of each position to fill"
        default: "10"
      first:
        description: "hero:position pairs to fill first, comma separated"
        default: "93:1"

permissions:
  contents: read

concurrency:
  group: matchup-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fill the cache
        working-directory: services/accounts
        # Only this step gets the keys: install scripts don't need them.
        env:
          SUPABASE_URL: https://odigcdwsvajkbvcxeskj.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
          HEROES_PER_POSITION: ${{ inputs.heroes_per_position || '10' }}
          # Slark carry first: Can's Mage Slayer question (2026-11-11). Filled rows are skipped, so it costs
          # nothing once done.
          FIRST: ${{ inputs.first || '93:1' }}
        run: npx deno run --node-modules-dir=none --no-lock --allow-net --allow-env supabase/functions/_shared/matchup/backfill.ts
